<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 74 350 396" width="350" height="396">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.16 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gc"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gc"/></feMerge>
    </filter>
    <clipPath id="roofClip"><path d="M172 150 L262 140 L186 236 L86 246 Z"/></clipPath>
  </defs>

